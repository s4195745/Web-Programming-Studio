<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootBox - Latest Collection</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="index.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
        </div>
    </nav>
    <!-- ================= MAIN PRODUCT LISTING ================= -->
    <!-- Module: Shopping Cart | Author: Sebastion Beryl -->
    <main class="product-collection">
        <h1>Latest Collection</h1>
        
        <!-- Hardcoded product list for static site evaluation -->
        <section class="product-list">
            
            <!-- Product Item 1 -->
            <article class="product-card">
                <a href="product-detail.html" class="img-box" aria-label="View details of Hollow Knight">
                    <img src="../../assets/cart.images/white/white_hk_main.webp" alt="Hollow Knight White Merchandise">
                </a>
                <a href="product-detail.html" class="product-link">
                    <h2 class="title">Hollow Knight</h2>
                    <span class="price">$32.00</span>
                </a>
            </article>

            <!-- Product Item 2 -->
            <article class="product-card">
                <a href="product-detail.html" class="img-box" aria-label="View details of Arknights Endfield Plushie">
                    <img src="../../assets/cart.images/brown/enfi_brown_main.avif" alt="Arknights: Endfield PoofyShan Plushie">
                </a>
                <a href="product-detail.html" class="product-link">
                    <h2 class="title">Arknights: Endfield - PoofyShan Plushie</h2>
                    <span class="price">$35.00</span>
                </a>
            </article>

            <!-- Product Item 3 -->
            <article class="product-card">
                <a href="product-detail.html" class="img-box" aria-label="View details of Pengu Garen Figure">
                    <img src="../../assets/cart.images/white/pengu_white_main.webp" alt="League of Legends Pengu Garen Figure">
                </a>
                <a href="product-detail.html" class="product-link">
                    <h2 class="title">Pengu Garen Figure</h2>
                    <span class="price">$35.99</span>
                </a>
            </article>

        </section>   
    </main>

    <!-- Scripts are commented out for static assignment evaluation -->
    <!-- <script src="products.js"></script> -->
    <!-- <script src="script.js"></script> -->
</body>
</html>
