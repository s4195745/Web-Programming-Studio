<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product detail</title>
    <link rel="stylesheet" href="../../assets/css/cart.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"rel="stylesheet"/>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LootBox.</a>

        <a href="cart.html" class="cart-icon">
            <i class="ri-shopping-bag-line"></i>
        </a>
    </nav>

    <div class="product-detail">
        <div class="product-img">
            <div class="thumbnail-list"> 
                <!-- <img src ="../../assets/cart.images/product_HK_knight_plush_photo1.webp">
                <img src ="../../assets/cart.images/product_HK_knight_plush_photo2.webp">
                <img src ="../../assets/cart.images/product_HK_knight_plush_photo3.webp"> -->
            </div>
            <div class="main-img">
                <!-- <img src="../../assets/cart.images/product_HK_knight_plush_main.webp"> -->
            </div>

        </div>
        
        <div class="product-info">
            <h2 class="title"></h2>
            <div class="rating">
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-fill"></i>
                <i class="ri-star-line"></i>
                <span>(4.8)</span>
            </div>
         </div>
         <span class ="price"></span>
         <p class="description"> </p>
         <div class="size-selection">
            <p>Select Size</p>
            <div class="size-options">
                <!-- <button class="selected">S</button>
                <Button>M</Button>
                <Button>L</Button>
                <Button>XL</Button>
                <Button>XXL</Button> -->
            </div>
         </div>
         <div class = "color-options">
            
         </div>

         <button class="btn" id="add-cart-btn"> Add to Cart</button>
         <div class="product-policy">
            <p>100% Original Product (literally from the hollownest)</p>
            <p>Easy return and exchange policy within 14 days</p>
         </div>

    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
