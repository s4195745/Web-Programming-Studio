<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="../../landing_page.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
        </div>
    </nav>


    <!-- ================= CART SECTION ================= -->
    <!-- Module: Shopping Cart | Author: Nguyen The Chinh -->
    <main class="cart">
        <!-- Sorting Controls -->
        <section class="cart-controls">
            <label for="cart-sort">Sort by:</label>
            <select id="cart-sort" name="cart-sort">
                <option value="default">Recently Added</option>
                <option value="title-asc">Title (A-Z)</option>
                <option value="title-desc">Title (Z-A)</option>
                <option value="price-asc">Price (Low to High)</option>
                <option value="price-desc">Price (High to Low)</option>
            </select>
        </section>

        <header class="cart-header">
            <span>Products</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Total</span>
            <span>Remove</span>
        </header>

        <!-- Hardcoded Cart Items -->
        <section class="cart-items">
            <!-- Item 1 -->
            <article class="cart-item">
                <div class="product">
                    <img src="../../assets/cart.images/white/white_hk_main.webp" alt="Hollow Knight T-Shirt - White Color">
                    <div class="item-detail">
                        <p>Hollow Knight</p>
                        <div class="item-variants">
                            <span class="size">M</span>
                            <span class="color">White</span>
                        </div>
                    </div>
                </div>
                <span class="price">$32.00</span>
                <div class="quantity">
                    <input type="number" value="1" min="1" name="quantity_hk_white" aria-label="Quantity for Hollow Knight">
                </div>
                <span class="total-price">$32.00</span>
                <button class="remove" aria-label="Remove item"><i class="ri-close-line"></i></button>
            </article>

            <!-- Item 2 -->
            <article class="cart-item">
                <div class="product">
                    <img src="../../assets/cart.images/brown/enfi_brown_main.avif" alt="Arknights Endfield PoofyShan Plushie - Brown">
                    <div class="item-detail">
                        <p>Arknights: Endfield - PoofyShan Plushie</p>
                        <div class="item-variants">
                            <span class="size">S</span>
                            <span class="color">Brown</span>
                        </div>
                    </div>
                </div>
                <span class="price">$35.00</span>
                <div class="quantity">
                    <input type="number" value="2" min="1" name="quantity_arknights_brown" aria-label="Quantity for Arknights Plushie">
                </div>
                <span class="total-price">$70.00</span>
                <button class="remove" aria-label="Remove item"><i class="ri-close-line"></i></button>
            </article>
        </section>

        <!-- Cart Summary -->
        <section class="cart-total">
            <h3>Cart Total</h3>
            <p>Subtotal <span class="Subtotal">$102.00</span></p>
            <p>Delivery Fee <span>Free</span></p>
            <p>Grand Total <span class="grand-total">$102.00</span></p>
            <a href="checkout.html" class="btn action-btn">Proceed to checkout</a>
        </section>
    </main>

    <!-- <script src="products.js"></script> -->
    <!-- <script src="script.js"></script> -->
</body>
</html>
