<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <title>Checkout</title>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">LootBox.</a>
        <a href="cart.html" class="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count">0</span>
        </a>
    </nav>

    <div class="checkout-page">
        <h2>Complete Your Order</h2>
        
        <form id="checkout-form" class="checkout-form">
            <h3>Delivery Information</h3>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="address">Shipping Address</label>
                <input type="text" id="address" required placeholder="123 LootBox Street, Gaming City">
            </div>

            <h3 style="margin-top: 20px;">Payment Details</h3>
            <div class="form-group">
                <label for="card">Credit Card Number</label>
                <input type="text" id="card" required placeholder="1234 5678 9101 1121" maxlength="16">
            </div>
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" required placeholder="MM/YY">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" required placeholder="123" maxlength="3">
                </div>
            </div>

            <button type="submit" class="btn">Pay Now & Place Order</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
