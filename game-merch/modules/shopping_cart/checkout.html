<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="../../landing_page.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
        </div>
    </nav>
    <!-- ================= CHECKOUT SECTION ================= -->
    <!-- Module: Shopping Cart | Author: Nguyen The Chinh -->
    <main class="checkout-page">
        <h2>Complete Your Order</h2>
        
        <!-- Form configured for static navigation to confirmation page -->
        <form action="confirmation.html" method="GET" id="checkout-form" class="checkout-form">
            
            <h3>Delivery Information</h3>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="customerName" required placeholder="Sebastion Beryl" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="address">Shipping Address</label>
                <input type="text" id="address" name="customerAddress" required placeholder="RMIT University, Handi Resco Building" autocomplete="street-address">
            </div>

            <h3 class="payment-title">Payment Details</h3>
            <div class="form-group">
                <label for="card">Credit Card Number</label>
                <input type="text" id="card" name="cardNumber" required placeholder="1234 5678 9101 1121" maxlength="19" inputmode="numeric" pattern="[0-9\s]+">
            </div>
            <div class="payment-group">
                <div class="form-group flex-1">
                    <label for="expiry">Expiry Date</label>
                    <input type="text" id="expiry" name="cardExpiry" required placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/[0-9]{2}">
                </div>
                <div class="form-group flex-1">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cardCVV" required placeholder="123" maxlength="4" inputmode="numeric" pattern="[0-9]{3,4}">
                </div>
            </div>

            <button type="submit" class="btn full-width-btn">Pay Now & Place Order</button>
        </form>
    </main>

    <!-- <script src="script.js"></script> -->
</body>
</html>
