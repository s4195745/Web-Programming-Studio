<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
        <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="index.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
            <!-- User Avatar Link to Profile Page -->
            <a href="profile.html" class="nav-profile-link">
                
                <img src="../../assets/images/Nguyen The Chinh.jpg" alt="User Profile" class="nav-avatar">
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <p>Reset your password</p>
            <h2>Forgot Password</h2>
        </div>

        <!-- Action trỏ tới trang thông báo đã gửi code -->
        <form class="auth-form" action="forgot_password_confirm.html" method="GET">
            <div class="input-group">
                <p style="font-size: 14px; color: #555; margin-bottom: 15px;">
                    Enter your email address and we'll send you a code to reset your password.
                </p>
                <input type="email" id="reset-email" name="email" placeholder="Email address" required>
            </div>
            
            <button type="submit" class="auth-btn">Send Code</button>
            
            <p class="auth-link" style="margin-top: 25px;">
                Remembered your password? <a href="login.html">Sign In</a>
            </p>
        </form>
    </div>
    
</body>
</html>
