<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - LootBox</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body style="background-color: #f7f7f7;">
    <!-- Top Navigation Bar -->
    <nav>
        <a href="#" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="#">Shop</a>
            <a href="#">Forum</a>
            <a href="#">Blog</a>
            <a href="#">Sitemap</a>
            <a href="profile.html">Login/Profile</a>
            <a href="#">Wishlist</a>
        </div>
        <div class="nav-actions">
            <div class="search-bar">
                <input type="text" placeholder="Search...">
                <button type="button"></button>
            </div>
            <a href="cart.html" class="cart-icon">
                
                <span class="cart-item-count active">2</span>
            </a>
            <a href="profile.html" class="nav-profile-link">
                <img src="../../assets/images/avatar.jpg" alt="User Profile" class="nav-avatar">
            </a>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <aside class="dashboard-sidebar">
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="edit_profile.html" class="active">Edit Profile</a></li>
                <li><a href="#">Orders</a></li>
                <li><a href="#">Wish List</a></li>
                <li><a href="#">Help / FAQ</a></li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <!-- Form submits back to the edit profile page upon completion -->
            <form action="edit_profile.html" method="GET">
                <div class="dashboard-card">
                    <div class="card-header-flex">
                        <div class="card-title">Set New Password</div>
                    </div>
                    
                    <div class="form-row">
                        <label class="form-label">New Password</label>
                        <div class="form-input-wrapper">
                            <input type="password" required>
                        </div>
                    </div>

                    <div class="form-row" style="border-bottom: none; padding-bottom: 0;">
                        <label class="form-label">Confirm New Password</label>
                        <div class="form-input-wrapper">
                            <input type="password" required>
                        </div>
                    </div>

                    <div style="margin-top: 25px; display: flex; gap: 15px;">
                        <button type="submit" class="btn-orange">Update Password</button>
                        <a href="edit_profile.html" class="btn-cancel">Cancel</a>
                    </div>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
