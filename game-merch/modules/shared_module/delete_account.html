<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
        <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="../../landing_page.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
            <!-- User Avatar Link to Profile Page -->
            <a href="profile.html" class="nav-profile-link">
                
                <img src="../../assets/images/Nguyen The Chinh.jpg" alt="User Profile" class="nav-avatar">
            </a>
        </div>
    </nav>

    <div class="auth-container message-container">
        <!-- Danger Icon -->
        <div class="message-icon danger-icon">⚠️</div>
        <div class="auth-header mb-15">
            <h2 class="danger-heading">Delete Account?</h2>
        </div>
        
        <p class="warning-text">
            Are you sure you want to delete your account?
        </p>
        <p class="warning-subtext">
            This action cannot be undone. All your data, wishlist, and forum posts will be permanently removed.
        </p>

        <!-- Confirmed delete action redirects to register page -->
        <a href="register.html" class="no-decoration">
            <button type="button" class="auth-btn btn-danger no-margin-top">Yes, Delete My Account</button>
        </a>
        
        <!-- Cancel button redirects back to edit profile -->
        <a href="edit_profile.html" class="no-decoration">
            <button type="button" class="auth-btn btn-outline">Cancel</button>
        </a>
    </div>

    
    
</body>
</html>
