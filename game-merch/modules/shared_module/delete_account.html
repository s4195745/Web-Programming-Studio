<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
        <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="index.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
            <!-- User Avatar Link to Profile Page -->
            <a href="profile.html" class="nav-profile-link">
                
                <img src="../../assets/images/Nguyen The Chinh.jpg" alt="User Profile" class="nav-avatar">
            </a>
        </div>
    </nav>

    <div class="auth-container message-container">
        <div class="message-icon" style="color: #dc3545;">⚠️</div>
        <div class="auth-header" style="margin-bottom: 15px;">
            <h2 style="color: #dc3545;">Delete Account?</h2>
        </div>
        
        <p style="font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 10px;">
            Are you sure you want to delete your account?
        </p>
        <p style="font-size: 14px; color: #888; margin-bottom: 30px;">
            This action cannot be undone. All your data, wishlist, and forum posts will be permanently removed.
        </p>

        <!-- Nút xác nhận xóa sẽ đưa người dùng ra thẳng trang đăng ký -->
        <a href="register.html" style="text-decoration: none;">
            <button type="button" class="auth-btn btn-danger" style="margin-top: 0;">Yes, Delete My Account</button>
        </a>
        
        <!-- Nút hủy quay về trang sửa hồ sơ -->
        <a href="edit_profile.html" style="text-decoration: none;">
            <button type="button" class="auth-btn btn-outline">Cancel</button>
        </a>
    </div>

    
    
</body>
</html>
