<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
        <!-- ================= SHARED NAVIGATION ================= -->
    <nav>
        <a href="../../landing_page.html" class="logo">LootBox.</a>
        <div class="nav-links">
            <a href="">Shop</a>
            <a href="">Forum</a>
            <a href="">Blog</a>
            <a href="">Sitemap</a>
            <a href="">Login/Profile</a>
            <a href="">Wishlist</a>
        </div>
        <!-- Search and Cart Grouping -->
        <div class="nav-actions">
            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search..." aria-label="Search">
                <button type="button" aria-label="Submit search"><i class="ri-search-line"></i></button>
            </div>

            <!-- Cart Icon -->
            <a href="cart.html" class="cart-icon">
                <i class="ri-shopping-bag-line"></i>
                <span class="cart-item-count active">2</span>
            </a>
            <!-- User Avatar Link to Profile Page -->
            <a href="profile.html" class="nav-profile-link">
                
                <img src="../../assets/images/Nguyen The Chinh.jpg" alt="User Profile" class="nav-avatar">
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <!-- Form submits to login.html to simulate successful registration -->
        <form class="auth-form" action="login.html" method="GET">
            <h2>Register</h2>
            
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <!-- Mandatory short description field as per assignment requirements -->
            <div class="input-group">
                <textarea id="description" name="description" placeholder="Short description about yourself..." required></textarea>
            </div>
            
            <button type="submit" class="auth-btn">Register</button>
            
            <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>
</body>
</html>
